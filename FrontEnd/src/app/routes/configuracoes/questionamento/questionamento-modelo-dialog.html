<div class="px-2 py-2 flex flex-col gap-6">
  <!-- Content Grid -->
  <div class="space-y-4">
    <div class="flex flex-col gap-1.5">
      <label for="questionnaire-name" class="text-xs font-bold text-slate-700 tracking-tight uppercase">Nome do Questionário <span class="text-red-500">*</span></label>
      <input
        id="questionnaire-name"
        name="titulo"
        pInputText
        [(ngModel)]="titulo"
        class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all text-sm"
        placeholder="Ex.: Pesquisa de Satisfação Pós-Venda"
       
      />
    </div>

    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-xl">
      <div class="flex flex-col">
        <label for="questionnaire-active" class="text-xs font-bold text-slate-700 uppercase tracking-tight">Status do Questionário</label>
        <span class="text-[10px] text-slate-400 font-semibold mt-0.5">Ativar ou desativar este modelo de questionário</span>
      </div>
      <p-toggleswitch inputId="questionnaire-active" [(ngModel)]="ativo" />
    </div>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
    <button type="button"
      (click)="cancelar()"
      class="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 rounded-lg transition-all active:scale-95 border border-slate-200 bg-white">
      Cancelar
    </button>
    <button type="button"
      (click)="salvar()"
      class="px-5 py-2.5 text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm shadow-blue-200 transition-all flex items-center gap-2 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed border-0">
      <nt-icon name="check-circle" [size]="18" />
      <span>{{ isEdit ? 'Salvar Alterações' : 'Criar Questionário' }}</span>
    </button>
  </div>
</div>
