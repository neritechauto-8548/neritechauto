<main class="analytics-page" aria-labelledby="analytics-title"><page-header canonical hideBreadcrumb title="Análises e gráficos" titleId="analytics-title" eyebrow="Relatórios" description="Explore indicadores somente quando definição, atualização e escopo autorizado estiverem disponíveis."><div pageHeaderActions class="actions"><a class="nt-button nt-button--secondary" routerLink="/relatorios"><nt-icon name="report-analytics" [size]="16"/>Relatórios</a><a class="nt-button nt-button--secondary" routerLink="/home/gerencial"><nt-icon name="layout-dashboard" [size]="16"/>Dashboard</a></div></page-header><section class="filters"><label><span>Domínio</span><select [(ngModel)]="dominio"><option value="OPERACIONAL">Operacional</option><option value="COMERCIAL">Comercial</option><option value="FINANCEIRO">Financeiro</option><option value="ESTOQUE">Estoque</option></select></label><label><span>Período</span><select [(ngModel)]="periodo"><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select></label><label><span>Unidade</span><select [(ngModel)]="unidade"><option value="">Todas autorizadas</option></select></label><label class="toggle"><input [(ngModel)]="comparacao" type="checkbox"/><span>Comparar período anterior</span></label></section><section class="definition"><nt-icon name="info-circle" [size]="18"/><div><strong>Definição e freshness obrigatórios</strong><p>Gráficos usarão a mesma projeção, período com timezone da unidade e escopo autorizado.</p></div><span><nt-icon name="database" [size]="16"/>Dados indisponíveis</span></section><section class="charts"><article><header><span>Indicadores do domínio</span><h2>{{dominio}}</h2></header><nt-data-view-state kind="info" icon="chart-bar" title="Série aguardando projeção" description="Nenhum ponto, tendência, valor ou comparação é desenhado sem a série canônica e sua definição."/></article><article><header><span>Detalhamento</span><h2>Dimensões autorizadas</h2></header><nt-data-view-state kind="empty" icon="report-analytics" title="Tabela analítica aguardando dados" description="Unidade, período, status e demais dimensões serão disponibilizados pelo backend conforme a permissão do usuário."/></article></section></main>
