<main class="auth-page">
  <section class="auth-shell" aria-labelledby="reset-title">
    <header class="auth-brand">
      <div class="brand-mark" aria-hidden="true">N</div>
      <div><span class="brand-name">NERITECH</span><span class="brand-product">AUTO</span></div>
    </header>
    <div class="auth-card">
      <div class="auth-header">
        <h1 id="reset-title">Redefinir senha</h1>
        <p>Escolha uma nova senha para voltar a acessar sua conta.</p>
      </div>
      <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="auth-form" novalidate>
        <div class="field">
          <label for="password">Nova senha</label>
          <input id="password" type="password" autocomplete="new-password" placeholder="Digite sua nova senha" formControlName="password" />
          <p *ngIf="password.errors?.['required'] && password.touched" class="field-error">Informe sua nova senha.</p>
          <p *ngIf="password.errors?.['minlength'] && password.touched" class="field-error">A senha deve ter no mínimo 6 caracteres.</p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmar nova senha</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repita sua nova senha" formControlName="confirmPassword" />
          <p *ngIf="resetForm.errors?.['mismatch'] && confirmPassword.touched" class="field-error">As senhas não coincidem.</p>
        </div>
        <button type="submit" class="auth-primary" [disabled]="resetForm.invalid || isSubmitting">
          <span *ngIf="!isSubmitting">Atualizar senha</span>
          <span *ngIf="isSubmitting" class="loading-content"><span class="spinner" aria-hidden="true"></span>Atualizando...</span>
        </button>
      </form>
      <a routerLink="/auth/login" class="back-link">Voltar para o login</a>
    </div>
  </section>
</main>
