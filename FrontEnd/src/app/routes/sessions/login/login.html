<main class="auth-page">
  <section class="auth-shell" aria-labelledby="login-title">
    <header class="auth-brand">
      <div class="brand-mark" aria-hidden="true">N</div>
      <div>
        <span class="brand-name">NERITECH</span>
        <span class="brand-product">AUTO</span>
      </div>
    </header>

    <div class="auth-card">
      <div class="auth-header">
        <h1 id="login-title">Entrar no NERITECH AUTO</h1>
        <p>Acesse sua operação de oficina com segurança.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="auth-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input
            id="email"
            type="email"
            formControlName="username"
            autocomplete="username"
            placeholder="voce@empresa.com"
            [attr.aria-invalid]="username.invalid && (username.dirty || username.touched)"
            [attr.aria-describedby]="username.invalid && (username.dirty || username.touched) ? 'email-error' : null"
          />
          <p
            *ngIf="username.invalid && (username.dirty || username.touched)"
            id="email-error"
            class="field-error"
          >
            <span *ngIf="username.errors?.['required']">Informe seu e-mail.</span>
            <span *ngIf="username.errors?.['remote']">{{ username.errors?.['remote'] }}</span>
          </p>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="password">Senha</label>
            <a routerLink="/auth/recover">Esqueci minha senha</a>
          </div>

          <div class="password-field">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              [attr.aria-invalid]="password.invalid && (password.dirty || password.touched)"
              [attr.aria-describedby]="password.invalid && (password.dirty || password.touched) ? 'password-error' : null"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
              [attr.aria-pressed]="showPassword"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"></path>
  <circle cx="12" cy="12" r="2.5"></circle>
</svg>
<svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="m3 3 18 18"></path>
  <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6 0 9.5 7 9.5 7a17.5 17.5 0 0 1-3.1 3.9"></path>
  <path d="M6.7 6.7C4.1 8.4 2.5 12 2.5 12s3.5 7 9.5 7a10.8 10.8 0 0 0 3.4-.6"></path>
  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
</svg>
            </button>
          </div>

          <p
            *ngIf="password.invalid && (password.dirty || password.touched)"
            id="password-error"
            class="field-error"
          >
            <span *ngIf="password.errors?.['required']">Informe sua senha.</span>
            <span *ngIf="password.errors?.['remote']">{{ password.errors?.['remote'] }}</span>
          </p>
        </div>

        <label class="remember-field">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Manter meu e-mail preenchido</span>
        </label>

        <button type="submit" class="auth-primary" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Entrar</span>
          <span *ngIf="isSubmitting" class="loading-content">
            <span class="spinner" aria-hidden="true"></span>
            Entrando...
          </span>
        </button>
      </form>
    </div>

    <footer class="auth-footer">
      <span>NERITECH AUTO</span>
      <span aria-hidden="true">•</span>
      <span>Gestão inteligente para oficinas</span>
    </footer>
  </section>
</main>
