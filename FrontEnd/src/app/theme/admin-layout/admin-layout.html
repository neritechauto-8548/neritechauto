<a class="nt-skip-link" href="#nt-main-content">Ir para o conteúdo principal</a>
<div
  class="matero-container-wrap"
  [class.matero-sidenav-collapsed]="options.sidenavCollapsed && !isOver && options.navPos !== 'top'"
  [class.matero-navbar-side]="options.navPos === 'side'"
  [class.matero-navbar-top]="options.navPos === 'top'"
  [class.matero-header-above]="options.headerPos === 'above'"
  [class.matero-header-fixed]="options.headerPos === 'fixed'"
  [dir]="options.dir"
>
  <ng-progress ngProgressRouter />

  <!-- Header Above -->
  @if (options.showHeader && options.headerPos === 'above') {
    <app-header
      (toggleSidenav)="onSidenavToggle()"
      (toggleSidenavNotice)="sidenavNotice.toggle()"
      [showBranding]="isOver || options.navPos === 'top'"
      [showToggle]="isOver || options.sidenavCollapsed"
    />
  }

  <mat-sidenav-container class="matero-container" autosize autoFocus>
    <mat-sidenav
      #sidenav
      class="matero-sidenav transition-colors duration-200 {{options.menuThemeClass || '!bg-[var(--p-surface-0)] dark:!bg-[var(--p-surface-900)]'}}"
      [mode]="isOver ? 'over' : 'side'"
      [opened]="options.navPos === 'side' && options.sidenavOpened && !isOver"
      (openedChange)="onSidenavOpenedChange($event)"
      (transitionend)="onLayoutTransitionEnd($event)"
      (closedStart)="onSidenavClosedStart()"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()"
    >
      <app-sidebar
        [showToggle]="!isOver"
        [showUser]="false"
        [showHeader]="true"
        [toggleChecked]="options.sidenavCollapsed && !isOver"
        (toggleCollapsed)="toggleCollapsed()"
        (closeSidenav)="sidenav.close()"
      />
    </mat-sidenav>

    <mat-sidenav #sidenavNotice position="end" mode="over">
      <app-sidebar-notice />
    </mat-sidenav>

    <mat-sidenav-content #content class="matero-content">
      @if (options.showHeader && options.headerPos !== 'above') {
        <app-header
          [showToggle]="isOver || (options.sidenavCollapsed && options.navPos !== 'top')"
          [showBranding]="isOver || options.navPos === 'top'"
          (toggleSidenav)="onSidenavToggle()"
          (toggleSidenavNotice)="sidenavNotice.toggle()"
        />
      }

      @if (options.navPos === 'top') {
        <app-topmenu />
      }

      <app-breadcrumb />

      <main id="nt-main-content" class="matero-page-content" tabindex="-1" aria-label="Conteúdo principal">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>

</div>
