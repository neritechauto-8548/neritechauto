<header class="nt-topbar">
  <div class="nt-topbar-left">
    @if (showToggle || !settings.options.sidenavOpened) {
      <button class="nt-topbar-icon" type="button" (click)="toggleSidenav.emit()" [attr.aria-label]="settings.options.sidenavCollapsed ? 'Expandir menu' : 'Recolher menu'" [matTooltip]="settings.options.sidenavCollapsed ? 'Expandir menu' : 'Recolher menu'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    }
    @if (showBranding) {
      <app-branding [showName]="true" />
    }
  </div>

  <div class="nt-global-search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
    <input type="text" placeholder="Buscar e navegar..." aria-label="Buscar e navegar" />
    <kbd>Ctrl K</kbd>
  </div>

  <div class="nt-topbar-actions">
    <button class="nt-topbar-icon" type="button" (click)="toggleTheme()" aria-label="Alternar tema"
      [matTooltip]="settings.getThemeColor() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8 8 0 0 1 8.5 4 8 8 0 1 0 20 15.5Z"></path></svg>
    </button>
    <app-notification />
    <app-user />
  </div>
</header>
