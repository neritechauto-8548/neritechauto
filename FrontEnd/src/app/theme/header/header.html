<p-toolbar styleClass="neritech-topbar">
  <div class="neritech-topbar__left">
    @if (showToggle) {
      <button
        type="button"
        class="neritech-topbar__icon-button"
        aria-label="Alternar menu principal"
        matTooltip="Menu"
        (click)="toggleSidenav.emit()"
      >
        <nt-icon name="menu-2" [size]="20" />
      </button>
    }

    @if (showBranding) {
      <a routerLink="/home" class="neritech-topbar__brand" aria-label="NeriTech Auto - Home">
        <span class="neritech-topbar__brand-mark" aria-hidden="true">N</span>
        <span class="neritech-topbar__brand-name">NeriTech <strong>Auto</strong></span>
      </a>
    }

    <span class="neritech-topbar__separator" aria-hidden="true"></span>

    <span
      class="neritech-topbar__context-wrap"
      matTooltip="A troca de empresa/unidade será habilitada quando o contexto multiunidade estiver conectado."
    >
      <button
        type="button"
        class="neritech-topbar__context"
        disabled
        aria-disabled="true"
        aria-label="Contexto atual da empresa"
      >
        <nt-icon name="building" [size]="18" />
        <span>{{ companyLabel }}</span>
        <nt-icon name="chevron-down" [size]="16" />
      </button>
    </span>
  </div>

  <div class="neritech-topbar__search-wrap" matTooltip="Busca global em preparação">
    <div class="neritech-topbar__search" aria-disabled="true">
      <nt-icon name="search" [size]="18" />
      <input
        type="search"
        disabled
        aria-label="Busca global em preparação"
        placeholder="Buscar cliente, veículo, OS..."
      />
      <kbd>Ctrl K</kbd>
    </div>
  </div>

  <div class="neritech-topbar__actions">
    <a
      routerLink="/suporte"
      class="neritech-topbar__support"
      aria-label="Central de suporte"
      matTooltip="Suporte"
    >
      <nt-icon name="help-circle" [size]="18" />
      <span>Suporte</span>
    </a>

    <app-notification />
    <app-user />
  </div>
</p-toolbar>
