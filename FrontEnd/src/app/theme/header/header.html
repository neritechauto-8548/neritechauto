<header class="nt-topbar">
  <div class="nt-topbar-left">
    @if (showToggle) {
      <button class="nt-topbar-icon" type="button" (click)="toggleSidenav.emit()" [attr.aria-label]="settings.options.sidenavCollapsed ? 'Expandir menu' : 'Recolher menu'" [matTooltip]="settings.options.sidenavCollapsed ? 'Expandir menu' : 'Recolher menu'">
        <svg viewBox="0 0 24 24" aria-hidden="true">@if (settings.options.sidenavCollapsed) {<path d="M9 5l7 7-7 7"></path>} @else {<path d="M15 5l-7 7 7 7"></path>}</svg>
      </button>
    }
    @if (showBranding) {
      <app-branding [showName]="true" />
    }
  </div>

  <nav class="nt-reference-navigation" aria-label="Acessos principais">
    <a routerLink="/home">Aplicativos</a>
    <a routerLink="/configuracoes/empresa">Empresas</a>
    <a routerLink="/configuracoes/usuarios">Usuários</a>
    <a routerLink="/configuracoes/preferencias">Integrações</a>
    <button type="button" (click)="abrirAjuda()">Informativos</button>
    <a class="nt-master-link" routerLink="/configuracoes/assinatura">Master</a>
  </nav>

  <div class="nt-global-search" [class.nt-mobile-search-open]="mobileSearchOpen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
    <input #globalSearchInput id="nt-global-search-input" type="text" [ngModel]="searchTerm" (ngModelChange)="onSearch($event)" placeholder="Busca Inteligente" aria-label="Buscar páginas e módulos" autocomplete="off" role="combobox" aria-autocomplete="list" [attr.aria-expanded]="!!searchTerm.trim()" [attr.aria-controls]="searchTerm.trim() ? 'nt-search-results' : null" [attr.aria-activedescendant]="activeSearchIndex >= 0 ? 'nt-search-result-' + activeSearchIndex : null" (keydown)="onSearchKeydown($event)" />
    @if (searchTerm.trim()) {
      <div id="nt-search-results" class="nt-search-results" role="listbox" aria-label="Páginas disponíveis">
        @if (searchResults.length) {
          @for (result of searchResults; track result.route; let i = $index) {
            <button type="button" class="nt-search-result" [id]="'nt-search-result-' + i" [attr.aria-selected]="activeSearchIndex === i" (mouseenter)="activeSearchIndex = i" (click)="navigateSearch(result.route)" role="option">
              <span>{{ result.name }}</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </button>
          }
        } @else {
          <div class="nt-search-empty" role="option" aria-selected="false" aria-disabled="true">Nenhuma página encontrada no menu disponível.</div>
        }
      </div>
    }
    <kbd>CTRL+K</kbd>
  </div>

  <div class="nt-topbar-actions">
    <button type="button" class="nt-topbar-icon nt-mobile-search-toggle"
      [attr.aria-label]="mobileSearchOpen ? 'Fechar busca' : 'Abrir busca'"
      [attr.aria-expanded]="mobileSearchOpen"
      aria-controls="nt-global-search-input"
      (click)="toggleMobileSearch()">
      @if (mobileSearchOpen) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"></path></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
      }
    </button>
    <a class="nt-topbar-icon nt-parts-action" routerLink="/produtos-servicos/estoque" aria-label="Consultar peças" matTooltip="Consulta de peças no estoque"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v13H4zM7 9h10M7 13h7M17 21l-3-3"/></svg></a>
    <button class="nt-topbar-icon nt-help-action" type="button" (click)="abrirAjuda()" aria-label="Abrir Central de ajuda" matTooltip="Central de ajuda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 4v12l-8 4-8-4V6l8-4Z"/><path d="M9.5 9a2.7 2.7 0 0 1 5 1.3c0 2-2.5 2-2.5 3.8M12 17h.01"/></svg></button>
    <app-notification />
    <app-user />
  </div>
</header>
