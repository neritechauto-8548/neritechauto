<div class="nt-attendance" aria-label="Controle de presença">
  <button type="button" class="nt-attendance-action nt-attendance-in" disabled
    title="Check-in de funcionários: integração de ponto ainda não disponível"
    aria-label="Check-in de funcionários indisponível">
    <span class="nt-attendance-glyph" aria-hidden="true">↪</span><span class="nt-attendance-label">Check-in</span>
  </button>
  <button type="button" class="nt-attendance-action nt-attendance-out" disabled
    title="Check-out de funcionários: integração de ponto ainda não disponível"
    aria-label="Check-out de funcionários indisponível">
    <span class="nt-attendance-glyph" aria-hidden="true">↩</span><span class="nt-attendance-label">Check-out</span>
  </button>
</div>
<div class="nt-sidebar-menu"><app-sidemenu /></div>
<footer class="nt-sidebar-footer">
  @if (showToggle) {
    <button type="button" class="nt-collapse-button" (click)="toggleCollapsed.emit()"
      [attr.aria-label]="toggleChecked ? 'Expandir menu lateral' : 'Recolher menu lateral'"
      [attr.title]="toggleChecked ? 'Expandir' : 'Recolher'">
      <span aria-hidden="true">◧</span><span class="nt-collapse-label">{{ toggleChecked ? 'Expandir' : 'Recolher' }}</span>
      <kbd aria-hidden="true">[</kbd>
    </button>
  } @else {
    <button type="button" class="nt-collapse-button" (click)="closeSidenav.emit()"
      aria-label="Fechar menu lateral"><span aria-hidden="true">◧</span><span class="nt-collapse-label">Fechar</span></button>
  }
</footer>
