<nav aria-label="breadcrumb">
  <ol class="matero-breadcrumb">
    @for (item of navItems; track trackByNavItem($index, item); let isFirst = $first) {
      <li class="matero-breadcrumb-item">
        @if (isFirst) {
          <a routerLink="/home" class="link">{{ item === 'home' ? 'Início' : (item | translate) }}</a>
        }
        @if (!isFirst) {
          <mat-icon aria-hidden="true" class="chevron">chevron_right</mat-icon>
          <span>{{item | translate}}</span>
        }
      </li>
    }
  </ol>
</nav>
