<section class="matero-error-wrap" role="status" aria-labelledby="nt-error-title">
  <div class="matero-error-code" aria-hidden="true">{{ code }}</div>
  <h1 id="nt-error-title" class="matero-error-title">{{ title || 'Não foi possível abrir esta página' }}</h1>
  @if (message) {
    <p class="matero-error-message">{{ message }}</p>
  }
  <a mat-raised-button color="primary" routerLink="/home">Voltar ao início</a>
</section>
