@if (canonical) {
  <header class="nt-page-header">
    <div class="nt-page-header__content">
      @if (eyebrow) {
        <span class="nt-page-header__eyebrow">{{ eyebrow }}</span>
      }

      <div class="nt-page-header__title-row">
        <div class="nt-page-header__title-group">
          <h1 class="nt-page-header__title" [id]="titleId">{{ title | translate }}</h1>
          @if (supportingText) {
            <p class="nt-page-header__description">{{ supportingText }}</p>
          }
        </div>

        <div class="nt-page-header__meta">
          <ng-content select="[pageHeaderMeta]"></ng-content>
        </div>
      </div>

      @if (!hideBreadcrumb) {
        <breadcrumb [nav]="nav" />
      }
    </div>

    <div class="nt-page-header__actions">
      <ng-content select="[pageHeaderActions]"></ng-content>
    </div>
  </header>
} @else {
  <div class="matero-page-header-inner">
    @if (!hideBreadcrumb) {
      <breadcrumb [nav]="nav" />
    }
  </div>
}
