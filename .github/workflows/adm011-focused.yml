name: ADM-011 Configurações — testes focados

on:
  push:
    branches: [feature/develop]
    paths:
      - "FrontEnd/src/app/routes/configuracoes/preferencias/**"
      - "FrontEnd/src/app/routes/configuracoes/configuracoes.routes.ts"
      - "FrontEnd/public/data/menu.json"
      - "FrontEnd/scripts/navigation-contract.test.cjs"
      - "backend/src/main/java/com/neritech/saas/empresa/controller/PoliticasGeraisController.java"
      - "backend/src/main/java/com/neritech/saas/empresa/service/PoliticasGeraisService.java"
      - "backend/src/main/resources/db/migration/V276__adm011_politicas_gerais.sql"
      - "backend/src/test/java/com/neritech/saas/empresa/PoliticasGeraisTenantIntegrationTest.java"
      - ".github/workflows/adm011-focused.yml"
  workflow_dispatch:

concurrency:
  group: adm011-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Contrato de navegação e tokens
        run: node --test scripts/navigation-contract.test.cjs scripts/ui-tokens.test.cjs
      - name: Build Angular
        run: yarn build
      - name: Testes Angular ADM-011
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/routes/configuracoes/preferencias/preferencias.service.spec.ts

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Integração ADM-011
        run: mvn -B test -Dtest=PoliticasGeraisTenantIntegrationTest -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
