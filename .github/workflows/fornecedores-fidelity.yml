name: Fornecedores — fidelidade e integração
on:
  push:
    branches: [master]
    paths:
      - "FrontEnd/src/app/routes/fornecedor/**"
      - "backend/src/main/java/com/neritech/saas/produtoServico/controller/FornecedorReferenciaController.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/domain/Fornecedor.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/domain/enums/ClassificacaoFornecedor.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/dto/FornecedorRequest.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/dto/FornecedorResponse.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/service/FornecedorService.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/service/FornecedorHistoricoService.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/controller/FornecedorController.java"
      - "backend/src/main/java/com/neritech/saas/produtoServico/repository/FornecedorRepository.java"
      - "backend/src/test/java/com/neritech/saas/produtoServico/FornecedorTenantIntegrationTest.java"
      - "backend/src/test/resources/sql/fornecedor_referencia_test_schema.sql"
      - "backend/src/main/resources/db/migration/V301__fornecedores_referencia_visual.sql"
      - "backend/src/main/resources/db/migration/V302__contatos_fornecedor_estrangeiro.sql"
      - ".github/workflows/fornecedores-fidelity.yml"
  workflow_dispatch:
concurrency:
  group: fornecedores-fidelity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Compilar Angular
        run: yarn build
      - name: Testar API Angular de fornecedores
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/routes/fornecedor/fornecedor.service.spec.ts
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Isolamento de fornecedor e contratos existentes
        run: mvn -B test -Dtest=FornecedorTenantIntegrationTest
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: fornecedores
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fornecedores"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teste
      PGDATABASE: fornecedores
    steps:
      - uses: actions/checkout@v4
      - name: Criar dependências mínimas do banco existente
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create table empresa(id bigserial primary key);
          create table fin_plano_contas(id bigserial primary key,empresa_id bigint not null);
          create table produtos(id bigserial primary key);
          create table pedidos_fornecedor(
            id bigserial primary key, empresa_id bigint not null,
            fornecedor_id bigint not null,numero_pedido bigint
          );
          SQL
      - name: Aplicar esquema original de fornecedores
        run: psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V46__create_fornecedores_table.sql
      - name: Aplicar V301 no PostgreSQL 16
        run: psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V301__fornecedores_referencia_visual.sql
      - name: Aplicar migração de estrangeiro
        run: psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V302__contatos_fornecedor_estrangeiro.sql
      - name: Verificar cadastro, contatos, crédito e devolução
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into empresa default values;
          insert into fornecedores(empresa_id,tipo_pessoa,nome_fantasia,razao_social,ativo,classificacao,logradouro,bairro)
            values(1,'JURIDICA','Fornecedor Teste','Fornecedor Teste Ltda',true,'OUTROS','Rua do Comércio','Centro');
          insert into contatos_fornecedor(empresa_id,fornecedor_id,nome,sexo,contato_principal)
            values(1,1,'Vendedor','MASCULINO',true);
          insert into meios_contato_fornecedor(empresa_id,contato_id,tipo,valor,whatsapp)
            values(1,1,'CELULAR','81999999999',true);
          insert into pedidos_fornecedor(empresa_id,fornecedor_id,numero_pedido) values(1,1,1001);
          insert into produtos default values;
          insert into itens_devolvidos_fornecedor(empresa_id,fornecedor_id,pedido_id,produto_id,quantidade,valor)
            values(1,1,1,1,2,120);
          insert into creditos_fornecedor(empresa_id,fornecedor_id,pedido_id,valor)
            values(1,1,1,120);
          do $verify$
          begin
            if (select count(*) from contatos_fornecedor where empresa_id=1 and fornecedor_id=1) <> 1 then
              raise exception 'Contato não persistido';
            end if;
            if (select count(*) from itens_devolvidos_fornecedor where empresa_id=1 and fornecedor_id=1) <> 1 then
              raise exception 'Devolução não persistida';
            end if;
            if (select count(*) from creditos_fornecedor where empresa_id=1 and fornecedor_id=1) <> 1 then
              raise exception 'Crédito não persistido';
            end if;
          end $verify$;
          SQL
