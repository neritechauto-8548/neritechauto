name: ADM-009 Seguradoras — testes focados

on:
  push:
    branches: [feature/develop]
    paths:
      - "FrontEnd/src/app/routes/configuracoes/seguradoras/**"
      - "FrontEnd/src/app/routes/configuracoes/configuracoes.routes.ts"
      - "FrontEnd/src/app/routes/os/cadastro-os/**"
      - "FrontEnd/public/data/menu.json"
      - "FrontEnd/scripts/navigation-contract.test.cjs"
      - "backend/src/main/java/com/neritech/saas/empresa/controller/SeguradoraController.java"
      - "backend/src/main/java/com/neritech/saas/empresa/domain/Seguradora.java"
      - "backend/src/main/java/com/neritech/saas/empresa/dto/Seguradora*.java"
      - "backend/src/main/java/com/neritech/saas/empresa/service/SeguradoraService.java"
      - "backend/src/main/java/com/neritech/saas/empresa/repository/SeguradoraRepository.java"
      - "backend/src/test/java/com/neritech/saas/empresa/SeguradoraTenantIntegrationTest.java"
      - "backend/src/main/resources/db/migration/V274__adm009_seguradoras_os.sql"
      - ".github/workflows/adm009-focused.yml"
  workflow_dispatch:

concurrency:
  group: adm009-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Confirmar rota de seguradoras sem links quebrados
        run: node --test --test-name-pattern="não oferece cliques" scripts/navigation-contract.test.cjs
      - run: yarn build
      - name: Testes Angular ADM-009
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/routes/configuracoes/seguradoras/seguradora.service.spec.ts

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes de integração ADM-009
        run: mvn -B test -Dtest=SeguradoraTenantIntegrationTest -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
