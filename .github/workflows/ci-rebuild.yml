name: CI NeriTech Auto Rebuild

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'backend/**'
      - 'FrontEnd/**'
      - '.github/workflows/ci-rebuild.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'FrontEnd/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend / Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend-build:
    name: Frontend / Angular build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: FrontEnd
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build Angular application
        working-directory: FrontEnd
        run: yarn build
