name: CI NeriTech Auto Rebuild

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/ci-rebuild.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend / Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test
