name: Dashboard Quality

on:
  push:
    branches: ["feature/develop"]
    paths:
      - "FrontEnd/src/app/routes/dashboard/**"
      - "FrontEnd/src/app/app.routes.ts"
      - "backend/src/main/java/com/neritech/saas/dashboard/**"
      - "backend/src/main/java/com/neritech/saas/ordemservico/repository/OrdemServicoRepository.java"
      - ".github/workflows/dashboard-quality.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
