name: Dashboard Quality

# Mantém apenas a validação mais recente da branch em desenvolvimento.
concurrency:
  group: dashboard-quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["feature/develop"]
    paths:
      - "FrontEnd/src/app/routes/dashboard/**"
      - "FrontEnd/src/app/routes/sessions/login/**"
      - "FrontEnd/src/app/routes/sessions/recover/**"
      - "FrontEnd/src/app/theme/**"
      - "FrontEnd/src/app/core/bootstrap/**"
      - "FrontEnd/src/app/core/authentication/**"
      - "FrontEnd/src/app/core/interceptors/**"
      - "FrontEnd/src/app/core/services/notificacao.service.ts"
      - "FrontEnd/karma.conf.js"
      - "FrontEnd/src/app/shared/components/**"
      - "backend/src/main/java/com/neritech/saas/veiculo/**"
      - "backend/src/test/java/com/neritech/saas/**"
      - "FrontEnd/src/app/routes/home/**"
      - "FrontEnd/src/app/app.routes.ts"
      - "backend/src/main/java/com/neritech/saas/dashboard/**"
      - "backend/src/main/java/com/neritech/saas/ordemservico/repository/OrdemServicoRepository.java"
      - ".github/workflows/dashboard-quality.yml"
      - "backend/src/test/resources/application-test.properties"
      - "backend/src/test/resources/application-test.yml"
      - "FrontEnd/src/app/routes/cliente/**"
      - "FrontEnd/src/app/routes/agendamento/**"
      - "FrontEnd/src/app/routes/veiculo/**"
      - "FrontEnd/src/app/routes/os/**"
      - "backend/src/main/java/com/neritech/saas/cliente/**"
      - "backend/src/main/java/com/neritech/saas/security/**"
      - "backend/src/main/java/com/neritech/saas/gestaoUsuarios/**"
      - "backend/src/main/java/com/neritech/saas/comunicacao/**"
      - "backend/src/main/java/com/neritech/saas/common/tenancy/TenantInterceptor.java"
      - "backend/src/main/java/com/neritech/saas/common/tenancy/TenantFilterConfiguration.java"
      - "backend/src/main/resources/application.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "FrontEnd/src/app/routes/dashboard/**"
      - "FrontEnd/src/app/routes/sessions/login/**"
      - "FrontEnd/src/app/routes/sessions/recover/**"
      - "FrontEnd/src/app/theme/**"
      - "FrontEnd/src/app/core/bootstrap/**"
      - "FrontEnd/src/app/core/services/notificacao.service.ts"
      - "FrontEnd/karma.conf.js"
      - "FrontEnd/src/app/shared/components/**"
      - "backend/src/main/java/com/neritech/saas/veiculo/**"
      - "backend/src/test/java/com/neritech/saas/**"
      - "FrontEnd/src/app/routes/home/**"
      - "FrontEnd/src/app/app.routes.ts"
      - "backend/src/main/java/com/neritech/saas/dashboard/**"
      - "backend/src/main/java/com/neritech/saas/ordemservico/repository/OrdemServicoRepository.java"
      - "backend/src/test/resources/application-test.properties"
      - "backend/src/test/resources/application-test.yml"
      - "FrontEnd/src/app/routes/cliente/**"
      - "FrontEnd/src/app/routes/agendamento/**"
      - "FrontEnd/src/app/routes/veiculo/**"
      - "FrontEnd/src/app/routes/os/**"
      - "backend/src/main/java/com/neritech/saas/cliente/**"
      - "backend/src/main/java/com/neritech/saas/comunicacao/**"
      - "backend/src/main/java/com/neritech/saas/common/tenancy/TenantInterceptor.java"
      - "backend/src/main/java/com/neritech/saas/common/tenancy/TenantFilterConfiguration.java"
      - "backend/src/main/resources/application.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Testes de regressão do Application Shell
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/theme/header/header.spec.ts --include=src/app/theme/sidemenu/sidemenu.spec.ts --include=src/app/theme/sidemenu/preview-menu.spec.ts --include=src/app/theme/widgets/notification-button.spec.ts --include=src/app/core/authentication/auth-guard.spec.ts --include=src/app/core/authentication/auth.service.spec.ts --include=src/app/core/interceptors/token-interceptor.spec.ts --include=src/app/core/interceptors/tenant-interceptor.spec.ts --include=src/app/core/interceptors/error-interceptor.spec.ts
      - name: Publicar relatórios de testes Angular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            FrontEnd/coverage/
            FrontEnd/test-results/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B clean test -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
      - name: Publicar relatórios de testes Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
