name: Dashboard Quality

# Mantém apenas a validação mais recente da branch em desenvolvimento.
concurrency:
  group: dashboard-quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["feature/develop"]
    paths:
      - "FrontEnd/src/**"
      - "FrontEnd/scripts/**"
      - "FrontEnd/public/**"
      - "FrontEnd/angular.json"
      - "FrontEnd/karma.conf.js"
      - "FrontEnd/package.json"
      - "FrontEnd/yarn.lock"
      - "backend/src/**"
      - "backend/pom.xml"
      - ".github/workflows/dashboard-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "FrontEnd/src/**"
      - "FrontEnd/scripts/**"
      - "FrontEnd/public/**"
      - "FrontEnd/angular.json"
      - "FrontEnd/karma.conf.js"
      - "FrontEnd/package.json"
      - "FrontEnd/yarn.lock"
      - "backend/src/**"
      - "backend/pom.xml"
      - ".github/workflows/dashboard-quality.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - name: Validar contrato de navegação BASE-03
        run: node --test scripts/navigation-contract.test.cjs
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Testes de regressão do Application Shell
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/theme/header/header.spec.ts --include=src/app/theme/sidemenu/sidemenu.spec.ts --include=src/app/theme/sidemenu/preview-menu.spec.ts --include=src/app/theme/widgets/notification-button.spec.ts --include=src/app/core/authentication/auth-guard.spec.ts --include=src/app/core/authentication/permission-guard.spec.ts --include=src/app/core/authentication/token.service.spec.ts --include=src/app/core/bootstrap/startup-permissions.spec.ts --include=src/app/shared/components/data-view-state/data-view-state.spec.ts --include=src/app/shared/components/error-code/error-code.spec.ts --include=src/app/shared/components/page-header/page-header.spec.ts --include=src/app/shared/components/confirmation-dialog/confirmation-dialog.component.spec.ts --include=src/app/core/authentication/auth.service.spec.ts --include=src/app/core/interceptors/token-interceptor.spec.ts --include=src/app/core/interceptors/tenant-interceptor.spec.ts --include=src/app/core/interceptors/error-interceptor.spec.ts --include=src/app/routes/orcamento/orcamento.service.spec.ts
      - name: Publicar relatórios de testes Angular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            FrontEnd/coverage/
            FrontEnd/test-results/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B clean test -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
      - name: Publicar relatórios de testes Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
