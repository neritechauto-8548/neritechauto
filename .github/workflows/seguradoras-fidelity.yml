name: Seguradoras — fidelidade e integração
on:
  push:
    branches: [master]
    paths:
      - "FrontEnd/src/app/routes/configuracoes/seguradoras/**"
      - "backend/src/main/java/com/neritech/saas/empresa/controller/SeguradoraController.java"
      - "backend/src/main/java/com/neritech/saas/empresa/domain/Seguradora.java"
      - "backend/src/main/java/com/neritech/saas/empresa/dto/SeguradoraRequest.java"
      - "backend/src/main/java/com/neritech/saas/empresa/dto/SeguradoraResponse.java"
      - "backend/src/main/java/com/neritech/saas/empresa/repository/SeguradoraRepository.java"
      - "backend/src/main/java/com/neritech/saas/empresa/service/SeguradoraService.java"
      - "backend/src/main/resources/db/migration/V300__seguradoras_referencia_visual.sql"
      - "backend/src/test/java/com/neritech/saas/empresa/SeguradoraTenantIntegrationTest.java"
      - "backend/src/test/resources/docker-java.properties"
      - ".github/workflows/seguradoras-fidelity.yml"
  workflow_dispatch:
concurrency:
  group: seguradoras-fidelity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Validar compilação Angular
        run: yarn build
      - name: Validar chamadas HTTP do cadastro
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/routes/configuracoes/seguradoras/seguradora.service.spec.ts
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Validar contrato e isolamento no PostgreSQL
        run: mvn -B test -Dtest=SeguradoraTenantIntegrationTest
        env:
          SPRING_PROFILES_ACTIVE: test
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguradoras-backend-test-results
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
