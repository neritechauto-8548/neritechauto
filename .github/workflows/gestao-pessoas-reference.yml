name: Gestão de pessoas — Cargos EPIs Comissões

on:
  push:
    branches: [master]
    paths:
      - "FrontEnd/src/app/routes/configuracoes/cargos/**"
      - "FrontEnd/src/app/routes/configuracoes/epis/**"
      - "FrontEnd/src/app/routes/configuracoes/colaboradores/**"
      - "FrontEnd/src/app/routes/configuracoes/configuracoes.routes.ts"
      - "FrontEnd/src/app/routes/financeiro/comissoes/**"
      - "backend/src/main/java/com/neritech/saas/rh/controller/EpiController.java"
      - "backend/src/main/java/com/neritech/saas/rh/service/EpiService.java"
      - "backend/src/main/java/com/neritech/saas/financeiro/controller/ComissaoFuncionarioController.java"
      - "backend/src/main/java/com/neritech/saas/financeiro/service/ComissaoFuncionarioService.java"
      - "backend/src/main/java/com/neritech/saas/financeiro/repository/ComissaoFuncionarioRepository.java"
      - "backend/src/main/java/com/neritech/saas/financeiro/mapper/ComissaoFuncionarioMapper.java"
      - "backend/src/main/java/com/neritech/saas/financeiro/dto/ComissaoFuncionarioResponse.java"
      - "backend/src/main/resources/db/migration/V293__rh_epis_catalogo_entregas.sql"
      - "backend/src/test/java/com/neritech/saas/rh/EpiTenantIntegrationTest.java"
      - "backend/src/test/java/com/neritech/saas/financeiro/ComissaoQuitacaoTenantIntegrationTest.java"
      - ".github/workflows/gestao-pessoas-reference.yml"
  workflow_dispatch:

concurrency:
  group: gestao-pessoas-master
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Compilar Angular
        run: yarn ng build --configuration development
      - name: Testes Angular dos módulos
        run: |
          yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/routes/configuracoes/cargos/cargo.service.spec.ts --include=src/app/routes/configuracoes/epis/epi.service.spec.ts --include=src/app/routes/financeiro/comissoes/comissao-financeira.service.spec.ts

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compatibilidade Testcontainers
        run: |
          mkdir -p src/test/resources
          printf 'api.version=1.44\n' > src/test/resources/docker-java.properties
      - name: Testes integração e isolamento
        run: mvn -B test -Dtest=CargoTenantIntegrationTest,EpiTenantIntegrationTest,ComissaoQuitacaoTenantIntegrationTest
        env:
          SPRING_PROFILES_ACTIVE: test
