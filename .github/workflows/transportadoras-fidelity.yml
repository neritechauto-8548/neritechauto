name: Transportadoras — fidelidade e integração
on:
  push:
    branches: [master]
    paths:
      - 'FrontEnd/src/app/routes/configuracoes/transportadoras/**'
      - 'backend/src/main/java/com/neritech/saas/produtoServico/dto/TransportadoraRequest.java'
      - 'backend/src/main/java/com/neritech/saas/produtoServico/dto/TransportadoraResponse.java'
      - 'backend/src/main/java/com/neritech/saas/produtoServico/service/TransportadoraService.java'
      - 'backend/src/main/java/com/neritech/saas/produtoServico/repository/FornecedorRepository.java'
      - 'backend/src/main/resources/db/migration/V303__transportadoras_referencia_visual.sql'
      - 'backend/src/test/java/com/neritech/saas/produtoServico/TransportadoraTenantIntegrationTest.java'
      - '.github/workflows/transportadoras-fidelity.yml'
  workflow_dispatch:
concurrency:
  group: transportadoras-fidelity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Compilar frontend Angular
        run: yarn build
      - name: Testar contrato HTTP de transportadoras
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/routes/configuracoes/transportadoras/transportadora.service.spec.ts
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testar tenant, vínculo de compras e campos obrigatórios
        run: mvn -B test -Dtest=TransportadoraTenantIntegrationTest
      - name: Arquivar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transporte-test-results
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: transportadoras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transportadoras"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teste
      PGDATABASE: transportadoras
    steps:
      - uses: actions/checkout@v4
      - name: Preparar tabelas externas do banco existente
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE empresa(id BIGSERIAL PRIMARY KEY);
          CREATE TABLE fin_plano_contas(id BIGSERIAL PRIMARY KEY,empresa_id BIGINT);
          CREATE TABLE produtos(id BIGSERIAL PRIMARY KEY);
          CREATE TABLE pedidos_fornecedor(
            id BIGSERIAL PRIMARY KEY,empresa_id BIGINT NOT NULL,fornecedor_id BIGINT NOT NULL,
            numero_pedido BIGINT
          );
          INSERT INTO empresa DEFAULT VALUES;
          SQL
      - name: Reproduzir evolução de esquema
        run: |
          for migration in \
            V46__create_fornecedores_table.sql \
            V275__adm010_transportadoras_logistica.sql \
            V301__fornecedores_referencia_visual.sql \
            V302__contatos_fornecedor_estrangeiro.sql; do
            psql -v ON_ERROR_STOP=1 -f "backend/src/main/resources/db/migration/$migration"
          done
      - name: Inserir endereço legado de transportadora
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO fornecedores(empresa_id,tipo_pessoa,nome_fantasia,razao_social,
                                  endereco_completo,cidade,estado,transportadora,transportadora_ativa)
            VALUES(1,'JURIDICA','Transporte Teste','Transporte Teste',
                   'Rua do Comércio','Recife','PE',true,true);
          SQL
      - name: Validar V303 e preservação de dados
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V303__transportadoras_referencia_visual.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF NOT EXISTS(
              SELECT 1 FROM fornecedores
              WHERE empresa_id=1 AND transportadora=true AND transportadora_ativa=true
                AND logradouro='Rua do Comércio' AND endereco_completo='Rua do Comércio'
            ) THEN
              RAISE EXCEPTION 'Endereço anterior perdido';
            END IF;
            UPDATE fornecedores SET cep='54510000',logradouro='Av. Teste',
              numero='100',bairro='Centro',complemento='Galpão 2',
              inscricao_estadual='ISENTO' WHERE empresa_id=1 AND transportadora=true;
            IF NOT EXISTS(
              SELECT 1 FROM fornecedores WHERE empresa_id=1 AND transportadora=true
                AND cep='54510000' AND numero='100' AND bairro='Centro'
                AND complemento='Galpão 2' AND inscricao_estadual='ISENTO'
            ) THEN
              RAISE EXCEPTION 'Campos do drawer não persistiram';
            END IF;
          END $check$;
          SQL
