name: ADM-008 Fornecedores — testes focados

on:
  push:
    branches: [feature/develop]
    paths:
      - "FrontEnd/src/app/routes/fornecedor/**"
      - "backend/src/main/java/com/neritech/saas/produtoServico/**"
      - "backend/src/test/java/com/neritech/saas/produtoServico/**"
      - "backend/src/main/resources/db/migration/V273__supplier_tax_document_uniqueness.sql"
      - ".github/workflows/adm008-focused.yml"
  workflow_dispatch:

concurrency:
  group: adm008-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: FrontEnd/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Testes Angular ADM-008
        run: yarn ng test --watch=false --browsers=ChromeHeadless --include=src/app/routes/fornecedor/fornecedor.service.spec.ts

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes de integração ADM-008
        run: mvn -B test -Dtest=FornecedorTenantIntegrationTest,ProdutoFornecedorTenantTest -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
