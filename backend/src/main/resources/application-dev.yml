spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true
        jdbc:
          time_zone: UTC

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  flyway:
    enabled: false

  security:
    jwt:
      secret: ${JWT_SECRET:ZHVtbXktc2VjcmV0LWJhc2U2NC1ieXRlcy1mb3Itand0LXNpZ25pbmc=}
      expiration: 86400000
      refresh-token:
        expiration: 604800000

  mail:
    host: smtp.gmail.com
    port: 587
    username: '' # TODO: Your SMTP Email
    password: '' # TODO: Your SMTP App Password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  packages-to-scan: com.neritech.saas

logging:
  level:
    com.neritech.saas: DEBUG
    com.neritech.saas.common.tenancy: DEBUG
    org.springframework.web: DEBUG

stripe:
  api:
    key: '' # TODO: Your Stripe Secret Key (sk_test_...)