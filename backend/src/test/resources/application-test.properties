# Test Configuration
spring.main.banner-mode=off

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for unit/integration tests that use Hibernate DDL
spring.flyway.enabled=false

# JWT - Base64 com pelo menos 256 bits apos decodificacao
spring.security.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkLWZvci1oczI1Ni1hbGdvcml0aG0=
spring.security.jwt.expiration=3600000
spring.security.jwt.refresh-token.expiration=7200000
